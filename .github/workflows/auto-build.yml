name: Daily Auto Rebrand and Build LYRA

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout LYRA Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Clone Upstream Echo-Music (Latest Stable Release)
        run: |
          git clone --recursive https://github.com/EchoMusicApp/Echo-Music.git upstream_src
          cd upstream_src
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          git checkout $LATEST_TAG
          git submodule update --init --recursive
          
      - name: Copy Rebrand Script to Source
        run: |
          cp .github/scripts/rebrand.py upstream_src/rebrand.py
          
      - name: Run Rebrand Script
        working-directory: upstream_src
        run: python3 rebrand.py
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Build APK
        working-directory: upstream_src
        run: ./gradlew assembleDebug

      - name: Prepare APK for Release
        working-directory: upstream_src
        run: |
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} lyra.apk \;
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LYRA-App
          path: upstream_src/lyra.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "LYRA-Nightly-${{ github.run_number }}"
          name: "LYRA Auto-Build ${{ github.run_number }}"
          files: upstream_src/lyra.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
