name: Daily Auto Rebrand and Build LYRA

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout LYRA Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: lyra_scripts
          
      - name: Checkout Upstream Echo-Music
        uses: actions/checkout@v4
        with:
          repository: EchoMusicApp/Echo-Music
          ref: v1.0.1
          submodules: recursive
          path: upstream_src
          
      - name: Copy Rebrand Script to Source
        run: |
          cp lyra_scripts/.github/scripts/rebrand.py upstream_src/rebrand.py
          
      - name: Run Rebrand Script
        working-directory: upstream_src
        run: python3 rebrand.py
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Build APK
        working-directory: upstream_src
        run: ./gradlew :androidApp:assembleDebug

      - name: Prepare APK for Release
        working-directory: upstream_src
        run: |
          find androidApp/build/outputs/apk/debug/ -name "*.apk" -exec cp {} lyra.apk \;
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} lyra.apk \;
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LYRA-App
          path: upstream_src/lyra.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "LYRA-Nightly-${{ github.run_number }}"
          name: "LYRA Auto-Build ${{ github.run_number }}"
          files: upstream_src/lyra.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
